spring.application.name=refeitorio

spring.application.name=refeitorio

spring.datasource.url=jdbc:postgresql://localhost:5432/refeitorio
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conta administrativa inicial
app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.login=${APP_ADMIN_LOGIN:admin}
app.admin.senha=${APP_ADMIN_SENHA:}

server.port=8080
server.address=0.0.0.0