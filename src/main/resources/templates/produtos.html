<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Produtos</title>

        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>
            <h1 class="titulo">PRODUTOS</h1>

            <div class="barra-superior">

                <input type="text"
                       id="pesquisaProdutos"
                       placeholder="Pesquisar produto..."
                       class="input-arredondado">



            </div>
            <div class="tabela-container">

                <table class="tabela" id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>CÓDIGO DE BARRAS</th>
                            <th>PREÇO VENDA</th>
                            <th>PREÇO CUSTO</th>
                            <th>POR PESO</th>
                            <th>STATUS</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="produto : ${produtos}">
                            <td th:text="${produto.id}"></td>
                            <td th:text="${produto.nome}"></td>
                            <td th:text="${produto.codigoBarras}"></td>
                            <td th:text="${produto.precoVenda}"></td>
                            <td th:text="${produto.precoCusto}"></td>

                            <td class="coluna-status">

                                <span class="status status-ok"
                                      th:if="${produto.vendidoPorPeso}">
                                    POR PESO
                                </span>

                                <span class="status status-info"
                                      th:unless="${produto.vendidoPorPeso}">
                                    UNITÁRIO
                                </span>

                            </td>

                            <td>
                                <span th:if="${produto.ativo}"
                                      class="status-ativo">
                                    ATIVO
                                </span>

                                <span th:unless="${produto.ativo}"
                                      class="status-bloqueado">
                                    INATIVO
                                </span>
                            </td>

                            <td class="acoes-tabela">

                                <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                   class="botao-mini botao-amarelo">
                                    EDITAR
                                </a>

                                <form th:action="@{/produtos/desativar/{id}(id=${produto.id})}"
                                      method="post"
                                      class="form-acao-inline">

                                    <button type="submit"
                                            class="botao-mini botao-vermelho">
                                        DESATIVAR
                                    </button>

                                </form>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="acoes">

                <a href="/" class="botao botao-azul">
                    VOLTAR
                </a>

                <a href="/produtos/novo"
                   class="botao botao-verde">

                    NOVO PRODUTO

                </a>

            </div>

        </div>

        <div id="modalExcluirProduto" class="modal">

            <div class="modal-conteudo">

                <h2>Confirmar exclusão</h2>

                <p>Deseja realmente excluir este produto?</p>

                <div class="acoes">

                    <button type="button"
                            id="cancelarExclusaoProduto"
                            class="botao botao-azul">
                        CANCELAR
                    </button>

                    <form th:action="@{/produtos/desativar/{id}(id=${produto.id})}"
                          method="post"
                          class="form-acao-inline">

                        <button type="submit"
                                class="botao-mini botao-vermelho">
                            DESATIVAR
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {

                const menuProdutos =
                        document.getElementById("menu-produtos");

                if (menuProdutos) {
                    menuProdutos.classList.add("ativo");
                }

                const modal =
                        document.getElementById("modalExcluirProduto");

                const confirmar =
                        document.getElementById("confirmarExclusaoProduto");

                const cancelar =
                        document.getElementById("cancelarExclusaoProduto");

                const botoesExcluir =
                        document.querySelectorAll(".btn-excluir-produto");

                botoesExcluir.forEach(function (botao) {

                    botao.addEventListener("click", function () {

                        const url =
                                botao.getAttribute("data-url");

                        confirmar.setAttribute("href", url);

                        modal.style.display = "flex";
                    });
                });

                cancelar.addEventListener("click", function () {

                    confirmar.setAttribute("href", "#");

                    modal.style.display = "none";
                });

                window.addEventListener("click", function (event) {

                    if (event.target === modal) {

                        confirmar.setAttribute("href", "#");

                        modal.style.display = "none";
                    }
                });
            });
        </script>

    </body>
</html>
