<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Produtos</title>

        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>

            <h1 class="titulo">PRODUTOS</h1>

            <div class="barra-superior">

                <input type="text"
                       id="pesquisaProdutos"
                       placeholder="Pesquisar produto..."
                       class="input-arredondado">

            </div>

            <div class="tabela-container">

                <table class="tabela" id="tabelaProdutos">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>CÓDIGO DE BARRAS</th>
                            <th>PREÇO VENDA</th>
                            <th>PREÇO CUSTO</th>
                            <th>POR PESO</th>
                            <th>STATUS</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="produto : ${produtos}">

                            <td th:text="${produto.id}"></td>

                            <td th:text="${produto.nome}"></td>

                            <td th:text="${produto.codigoBarras}"></td>

                            <td th:text="${'R$ ' + #numbers.formatDecimal(produto.precoVenda, 1, 2)}"></td>

                            <td th:text="${'R$ ' + #numbers.formatDecimal(produto.precoCusto, 1, 2)}"></td>

                            <td class="coluna-status">

                                <span class="status-info"
                                      th:if="${produto.vendidoPorPeso}">
                                    POR PESO
                                </span>

                                <span class="status-ativo"
                                      th:unless="${produto.vendidoPorPeso}">
                                    UNITÁRIO
                                </span>

                            </td>

                            <td>

                                <span th:if="${produto.ativo}"
                                      class="status-ativo">
                                    ATIVO
                                </span>

                                <span th:unless="${produto.ativo}"
                                      class="status-bloqueado">
                                    INATIVO
                                </span>

                            </td>

                            <td class="acoes-tabela">

                                <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                   class="botao-mini botao-amarelo">
                                    EDITAR
                                </a>

                                <form th:if="${produto.ativo}"
                                      th:action="@{/produtos/desativar/{id}(id=${produto.id})}"
                                      method="post"
                                      class="form-acao-inline">

                                    <button type="submit"
                                            class="botao-mini botao-vermelho"
                                            onclick="return abrirModalConfirmacao(
                                                            this.form,
                                                            'Desativar produto',
                                                            'Deseja desativar este produto? Ele não ficará disponível para novas compras.'
                                                            )">
                                        DESATIVAR
                                    </button>

                                </form>

                                <form th:unless="${produto.ativo}"
                                      th:action="@{/produtos/reativar/{id}(id=${produto.id})}"
                                      method="post"
                                      class="form-acao-inline">

                                    <button type="submit"
                                            class="botao-mini botao-verde"
                                            onclick="return abrirModalConfirmacao(
                                                            this.form,
                                                            'Reativar produto',
                                                            'Deseja reativar este produto? Ele voltará a ficar disponível para compras.'
                                                            )">
                                        REATIVAR
                                    </button>

                                </form>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="acoes">

                <a href="/" class="botao botao-azul">
                    VOLTAR
                </a>

                <a href="/produtos/novo"
                   class="botao botao-verde">
                    NOVO PRODUTO
                </a>

            </div>

        </div>

        <div id="modalConfirmacao"
             class="modal-confirmacao"
             hidden>

            <div class="modal-confirmacao-caixa">

                <h2 id="modalConfirmacaoTitulo">
                    Confirmar ação
                </h2>

                <p id="modalConfirmacaoTexto">
                    Deseja continuar?
                </p>

                <div class="acoes">

                    <button type="button"
                            id="btnConfirmarModal"
                            class="botao botao-verde">
                        CONFIRMAR
                    </button>

                    <button type="button"
                            id="btnCancelarModal"
                            class="botao botao-vermelho">
                        CANCELAR
                    </button>

                </div>

            </div>

        </div>

        <script>
            let formularioConfirmacao = null;

            function abrirModalConfirmacao(formulario, titulo, texto) {

                formularioConfirmacao = formulario;

                document.getElementById("modalConfirmacaoTitulo").textContent = titulo;
                document.getElementById("modalConfirmacaoTexto").textContent = texto;

                document.getElementById("modalConfirmacao").hidden = false;

                return false;
            }

            document.addEventListener("DOMContentLoaded", function () {

                const menuProdutos = document.getElementById("menu-produtos");

                if (menuProdutos) {
                    menuProdutos.classList.add("ativo");
                }

                document.getElementById("btnCancelarModal")
                        .addEventListener("click", function () {

                            formularioConfirmacao = null;

                            document.getElementById("modalConfirmacao").hidden = true;
                        });

                document.getElementById("btnConfirmarModal")
                        .addEventListener("click", function () {

                            if (formularioConfirmacao) {
                                formularioConfirmacao.submit();
                            }
                        });
            });

            const pesquisaProdutos = document.getElementById("pesquisaProdutos");
            const tabelaProdutos = document.getElementById("tabelaProdutos");

            function normalizarTexto(texto) {
                return texto
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "");
            }

            if (pesquisaProdutos && tabelaProdutos) {

                pesquisaProdutos.addEventListener("input", function () {

                    const termoPesquisado = normalizarTexto(
                            pesquisaProdutos.value.trim()
                            );

                    const linhas = tabelaProdutos.querySelectorAll("tbody tr");

                    linhas.forEach(function (linha) {

                        const textoLinha = normalizarTexto(linha.textContent);

                        if (textoLinha.includes(termoPesquisado)) {
                            linha.style.display = "";
                        } else {
                            linha.style.display = "none";
                        }
                    });
                });
            }
        </script>

    </body>
</html>
