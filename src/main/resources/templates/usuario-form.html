<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Novo Usuário</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>
            <h1 class="titulo">NOVO USUÁRIO</h1>

            <div th:if="${erro}" class="mensagem-erro">

                <span th:text="${erro}"></span>

            </div>
            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post" class="formulario">

                <input type="hidden" th:field="*{id}">

                <label>Nome</label>
                <input type="text" th:field="*{nome}" class="input-arredondado" required>

                <label>Email</label>
                <input type="email" th:field="*{email}" class="input-arredondado" required>

                <label>Código RFID</label>
                <input type="text" th:field="*{codigoRfid}" class="input-arredondado" required>

                <label>Saldo</label>
                <input type="number" step="0.01" th:field="*{saldo}" class="input-arredondado" required>

                <label>Limite de Crédito</label>
                <input type="number" step="0.01" th:field="*{limiteCredito}" class="input-arredondado" required>

                <label>Status</label>

                <select th:field="*{ativo}" class="input-arredondado">
                    <option th:value="true">ATIVO</option>
                    <option th:value="false">BLOQUEADO</option>
                </select>

                <div class="acoes">
                    <button type="submit" class="botao botao-verde">SALVAR</button>
                    <a href="/usuarios/tela" class="botao botao-azul">CANCELAR</a>
                </div>

            </form>

        </div>

    </body>
</html>
