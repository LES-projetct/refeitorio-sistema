<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Meus Pagamentos</title>

        <link rel="stylesheet"
              th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <h1 class="titulo">
                MEUS PAGAMENTOS
            </h1>

            <div th:if="${erro}"
                 class="mensagem-erro"
                 role="alert">

                <span th:text="${erro}"></span>

            </div>

            <div th:if="${pagamentos == null or pagamentos.isEmpty()}"
                 class="mensagem-info">

                Nenhum pagamento encontrado.

            </div>

            <div th:if="${pagamentos != null and !pagamentos.isEmpty()}"
                 class="tabela-container">

                <table class="tabela">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>DATA</th>
                            <th>VALOR</th>
                            <th>SALDO ANTERIOR</th>
                            <th>SALDO ATUALIZADO</th>
                            <th>FORMA</th>
                            <th>OBSERVAÇÃO</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="pagamento : ${pagamentos}">

                            <td th:text="${pagamento.id}">
                                1
                            </td>

                            <td th:text="${#temporals.format(
                                pagamento.dataHora,
                                'dd/MM/yyyy HH:mm')}">
                                12/06/2026 20:30
                            </td>

                            <td th:text="${'R$ '
                                + #numbers.formatDecimal(
                                pagamento.valor,
                                1,
                                2)}">
                                R$ 0,00
                            </td>

                            <td th:text="${'R$ '
                                + #numbers.formatDecimal(
                                pagamento.saldoAnterior,
                                1,
                                2)}">
                                R$ 0,00
                            </td>

                            <td th:text="${'R$ '
                                + #numbers.formatDecimal(
                                pagamento.saldoAtualizado,
                                1,
                                2)}">
                                R$ 0,00
                            </td>

                            <td th:text="${pagamento.formaPagamento}">
                                PIX
                            </td>

                            <td th:text="${pagamento.observacao != null
                                and !pagamento.observacao.isBlank()
                                ? pagamento.observacao
                                : '-'}">
                                -
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="acoes acoes-pagina">

                <a th:href="@{/minha-conta}"
                   class="botao botao-azul">

                    VOLTAR

                </a>

                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="botao botao-vermelho">

                        SAIR

                    </button>

                </form>

            </div>

        </div>

    </body>
</html>
