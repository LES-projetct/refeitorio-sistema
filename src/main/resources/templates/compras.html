<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Compras</title>

        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>
            <h1 class="titulo">COMPRAS</h1>

            <div class="acoes acoes-pagina">

                <a th:href="@{/compras/nova}"
                   class="botao botao-verde">
                    NOVA COMPRA
                </a>

            </div>

            <!-- Mensagem apresentada após uma compra concluída -->
            <div th:if="${sucesso}"
                 class="mensagem-sucesso"
                 role="status">

                <span th:text="${sucesso}"></span>

            </div>

            <div th:if="${erro}"
                 class="mensagem-erro"
                 role="alert">

                <span th:text="${erro}"></span>

            </div>

            <div class="barra-superior"></div>

            <div class="tabela-container">
                <table class="tabela">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>USUÁRIO</th>
                            <th>VALOR TOTAL</th>
                            <th>SALDO ANTERIOR</th>
                            <th>SALDO ATUAL</th>
                            <th>DATA</th>
                            <th>AÇÃO</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="compra : ${compras}">

                            <td th:text="${compra.id}"></td>

                            <td th:text="${compra.usuario.nome}"></td>

                            <td th:text="${'R$ ' + #numbers.formatDecimal(compra.valorTotal, 1, 2)}"></td>

                            <td th:text="${'R$ ' + #numbers.formatDecimal(compra.saldoAnterior, 1, 2)}"></td>

                            <td th:text="${'R$ ' + #numbers.formatDecimal(compra.saldoAtualizado, 1, 2)}"></td>

                            <td th:text="${compra.dataHora != null
                                ? #temporals.format(compra.dataHora, 'dd/MM/yyyy HH:mm')
                                : '-'}">
                            </td>

                            <td class="acoes-tabela">

                                <a th:href="@{/compras/detalhes/{id}(id=${compra.id})}"
                                   class="botao-mini botao-azul">
                                    DETALHES
                                </a>

                                <a th:href="@{/compras/comprovante/{id}(id=${compra.id})}"
                                   class="botao-mini botao-verde">
                                    COMPROVANTE
                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>
            </div>

            <div class="acoes">

                <a href="/" class="botao botao-azul">
                    VOLTAR
                </a>

            </div>

        </div>

        <script>
            document.getElementById("menu-compras").classList.add("ativo");
        </script>

    </body>
</html>
