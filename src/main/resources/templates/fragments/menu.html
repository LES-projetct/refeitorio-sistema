<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <body>

        <aside th:fragment="menu" class="menu-lateral">

            <div class="menu-logo">

                <div class="menu-logo-icone">
                    R
                </div>

                <div>
                    <h2>RefeCard</h2>
                    <p>Sistema de Refeitório</p>
                </div>

            </div>

            <nav class="menu-links">

                <a id="menu-dashboard"
                   th:href="@{/}"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    Dashboard
                </a>

                <a id="menu-usuarios"
                   th:href="@{/usuarios/tela}"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    Usuários
                </a>

                <a id="menu-produtos"
                   th:href="@{/produtos/tela}"
                   sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    Produtos
                </a>

                <a id="menu-compras"
                   th:href="@{/compras/tela}"
                   sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    Compras
                </a>

                <a id="menu-nova-compra"
                   th:href="@{/compras/nova}"
                   sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    Nova Compra
                </a>

                <a id="menu-acessos"
                   th:href="@{/acessos/tela}"
                   sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    Acessos
                </a>

                <a id="menu-pagamentos"
                   th:href="@{/pagamentos/tela}"
                   sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                    Pagamentos
                </a>

                <a id="menu-despesas"
                   th:href="@{/despesas/tela}"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    Despesas
                </a>

                <a id="menu-relatorios"
                   th:href="@{/relatorios}"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    Relatórios
                </a>

                <a id="menu-contas"
                   th:href="@{/contas/tela}"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    Contas
                </a>

            </nav>

            <form th:action="@{/logout}"
                  method="post"
                  class="menu-sair-form">

                <button type="submit" class="menu-sair">
                    Sair
                </button>

            </form>

        </aside>

    </body>
</html>
