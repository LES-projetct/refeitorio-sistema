<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">

        <title>Acessos</title>

        <link rel="stylesheet"
              th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>

            <h1 class="titulo">
                CONTROLE DE ACESSOS
            </h1>

            <!-- Registro por RFID -->
            <div class="acesso-registro-card">

                <label for="rfidAcesso">
                    Código RFID
                </label>

                <div class="acesso-controles">

                    <input type="text"
                           id="rfidAcesso"
                           class="input-pdv"
                           placeholder="Aproxime o cartão ou digite o RFID"
                           autocomplete="off">

                    <button type="button"
                            id="btnEntrada"
                            class="botao botao-verde">

                        REGISTRAR ENTRADA

                    </button>

                    <button type="button"
                            id="btnSaida"
                            class="botao botao-azul">

                        REGISTRAR SAÍDA

                    </button>

                </div>

                <div id="mensagemAcesso"
                     class="mensagem-acesso"
                     role="status"
                     aria-live="polite"
                     hidden>
                </div>

            </div>

            <!-- Histórico -->
            <div class="tabela-container">

                <table class="tabela">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>USUÁRIO</th>
                            <th>ENTRADA</th>
                            <th>SAÍDA</th>
                            <th>STATUS</th>
                            <th>SITUAÇÃO</th>
                            <th>MOTIVO</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="acesso : ${acessos}">

                            <td th:text="${acesso.id}"></td>

                            <td th:text="${acesso.usuario != null
                                ? acesso.usuario.nome
                                : 'Usuário não localizado'}">
                            </td>

                            <td th:text="${acesso.dataHoraEntrada != null
                                ? #temporals.format(
                                acesso.dataHoraEntrada,
                                'dd/MM/yyyy HH:mm')
                                : '-'}">
                            </td>

                            <td th:text="${acesso.dataHoraSaida != null
                                ? #temporals.format(
                                acesso.dataHoraSaida,
                                'dd/MM/yyyy HH:mm')
                                : '-'}">
                            </td>

                            <td class="coluna-status">

                                <span class="status status-ok"
                                      th:if="${acesso.acessoPermitido}">
                                    LIBERADO
                                </span>

                                <span class="status status-bloqueado"
                                      th:unless="${acesso.acessoPermitido}">
                                    BLOQUEADO
                                </span>

                            </td>

                            <td class="coluna-status">

                                <span th:if="${!acesso.acessoPermitido}"
                                      class="status situacao-negada">
                                    NEGADO
                                </span>

                                <span th:if="${acesso.acessoPermitido
                                      and acesso.dataHoraSaida == null}"
                                      class="status situacao-aberta">
                                    EM ABERTO
                                </span>

                                <span th:if="${acesso.acessoPermitido
                                      and acesso.dataHoraSaida != null}"
                                      class="status situacao-finalizada">
                                    FINALIZADO
                                </span>

                            </td>

                            <td th:text="${acesso.motivoBloqueio != null
                                ? acesso.motivoBloqueio
                                : '-'}">
                            </td>

                        </tr>

                        <tr th:if="${acessos == null or acessos.isEmpty()}">

                            <td colspan="7">
                                Nenhum acesso registrado.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="acoes">

                <a th:href="@{/}"
                   class="botao botao-azul">

                    VOLTAR

                </a>

            </div>

        </div>

        <script th:src="@{/js/acesso.js}"></script>

    </body>
</html>
