<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">

        <title>Detalhes da Compra</title>

        <link rel="stylesheet"
              th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <!-- Faixa superior -->
            <div class="topo"></div>

            <!-- Menu -->
            <div th:replace="~{fragments/menu :: menu}"></div>

            <h1 class="titulo">
                DETALHES DA COMPRA
            </h1>

            <!-- Informações gerais -->
            <div class="detalhes-compra-grid">

                <div class="card-detalhe">

                    <span>Compra</span>

                    <strong th:text="${'#' + compra.id}"></strong>

                </div>

                <div class="card-detalhe">

                    <span>Cliente</span>

                    <strong th:text="${compra.usuario.nome}"></strong>

                </div>

                <div class="card-detalhe">

                    <span>Data e Hora</span>

                    <strong th:text="${compra.dataHora != null
                            ? #temporals.format(compra.dataHora, 'dd/MM/yyyy')
                            + ' às '
                            + #temporals.format(compra.dataHora, 'HH:mm')
                            : 'Data não informada'}">
                    </strong>


                </div>

                <div class="card-detalhe">

                    <span>Total</span>

                    <strong th:text="${'R$ ' + #numbers.formatDecimal(compra.valorTotal, 1, 2)}"></strong>

                </div>

                <div class="card-detalhe">

                    <span>Saldo anterior</span>

                    <strong th:text="${'R$ ' + #numbers.formatDecimal(compra.saldoAnterior, 1, 2)}"></strong>

                </div>

                <div class="card-detalhe">

                    <span>Saldo atualizado</span>

                    <strong th:text="${'R$ ' + #numbers.formatDecimal(compra.saldoAtualizado, 1, 2)}"></strong>

                </div>

            </div>

            <!-- Itens da compra -->
            <h2 class="subtitulo">
                ITENS DA COMPRA
            </h2>

            <div class="tabela-container">

                <table class="tabela">

                    <thead>
                        <tr>
                            <th>PRODUTO</th>
                            <th>QUANTIDADE/PESO</th>
                            <th>VALOR UNITÁRIO</th>
                            <th>VALOR TOTAL</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="item : ${compra.itens}">

                            <td th:text="${item.produto != null
                                ? item.produto.nome
                                : 'Produto não localizado'}">
                            </td>

                            <td>
                                <span th:if="${item.peso != null}"
                                      th:text="${#numbers.formatDecimal(
                                      item.peso, 1, 3) + ' kg'}">
                                </span>

                                <span th:if="${item.peso == null
                                      and item.quantidade != null}"
                                      th:text="${#numbers.formatDecimal(
                                      item.quantidade, 1, 0)}">
                                </span>

                                <span th:if="${item.peso == null
                                      and item.quantidade == null}">
                                    Não informado
                                </span>
                            </td>

                            <td th:text="${item.valorUnitario != null
                                ? 'R$ ' + #numbers.formatDecimal(
                                item.valorUnitario, 1, 2)
                                : 'R$ 0,00'}">
                            </td>

                            <td th:text="${item.valorTotal != null
                                ? 'R$ ' + #numbers.formatDecimal(
                                item.valorTotal, 1, 2)
                                : 'R$ 0,00'}">
                            </td>

                        </tr>

                        <tr th:if="${compra.itens == null
                            or compra.itens.isEmpty()}">

                            <td colspan="4">
                                Nenhum item registrado nesta compra.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="acoes">

                <a th:href="@{/compras/tela}"
                   class="botao botao-azul">

                    VOLTAR

                </a>

            </div>

        </div>

        <script>
            const menuCompras =
                    document.getElementById("menu-compras");

            if (menuCompras) {
                menuCompras.classList.add("ativo");
            }
        </script>

    </body>
</html>
