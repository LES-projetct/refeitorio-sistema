<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Recarregar Saldo</title>

        <link rel="stylesheet"
              th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <h1 class="titulo">
                RECARREGAR SALDO
            </h1>
            
            <div class="painel"></div>

            <div th:if="${erro}"
                 class="mensagem-erro"
                 th:text="${erro}">
                Erro
            </div>

            <form th:action="@{/minha-conta/recarregar}"
                  method="post"
                  class="formulario">

                <label for="valor">
                    Valor da recarga
                </label>

                <input type="number"
                       id="valor"
                       name="valor"
                       class="input-arredondado"
                       min="1"
                       step="0.01"
                       placeholder="Exemplo: 50.00"
                       required>

                <label for="formaPagamento">
                    Forma de pagamento
                </label>

                <select id="formaPagamento"
                        name="formaPagamento"
                        class="input-arredondado"
                        required>

                    <option value="">
                        Selecione
                    </option>

                    <option th:each="forma : ${formasPagamento}"
                            th:value="${forma}"
                            th:text="${forma == T(com.wanessa.refeitorio.enums.FormaPagamento).PIX
                                ? 'PIX'
                                : forma == T(com.wanessa.refeitorio.enums.FormaPagamento).CARTAO_CREDITO
                                    ? 'Cartão de crédito'
                                    : 'Cartão de débito'}">
                        Forma
                    </option>

                </select>

                <div class="mensagem-info">
                    Esta recarga será adicionada ao seu saldo.
                </div>

                <div class="acoes-pagina">

                    <button type="submit"
                            class="botao botao-verde">
                        CONFIRMAR RECARGA
                    </button>

                    <a th:href="@{/minha-conta/pagamentos}"
                       class="botao botao-azul">
                        VOLTAR
                    </a>

                </div>

            </form>

        </div>

    </body>
</html>
