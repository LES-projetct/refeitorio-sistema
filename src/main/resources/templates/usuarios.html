<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Usuários</title>

        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <div class="painel">

            <div class="topo"></div>

            <div th:replace="~{fragments/menu :: menu}"></div>

            <h1 class="titulo">USUÁRIOS</h1>

            <div class="barra-superior">

                <input type="text"
                       id="pesquisaUsuario"
                       placeholder="Pesquisar usuário..."
                       class="input-arredondado">



            </div>

            <div class="tabela-container">
                <table class="tabela" id="tabelaUsuarios">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>EMAIL</th>
                            <th>RFID</th>
                            <th>SALDO</th>
                            <th>STATUS</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="usuario : ${usuarios}">

                            <td th:text="${usuario.id}"></td>

                            <td th:text="${usuario.nome}"></td>

                            <td th:text="${usuario.email}"></td>

                            <td th:text="${usuario.codigoRfid}"></td>

                            <td th:text="${usuario.saldo}"></td>

                            <td>
                                <span th:if="${usuario.ativo}"
                                      class="status-ativo">
                                    ATIVO
                                </span>

                                <span th:unless="${usuario.ativo}"
                                      class="status-bloqueado">
                                    BLOQUEADO
                                </span>
                            </td>
                            <td>

                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                   class="botao-mini botao-azul">
                                    EDITAR
                                </a>

                                <button type="button"
                                        class="botao-mini botao-vermelho btn-excluir"
                                        th:attr="data-url=@{/usuarios/excluir/{id}(id=${usuario.id})}">
                                    EXCLUIR
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>
            </div>

            <div class="acoes">

                <a href="/" class="botao botao-azul">
                    VOLTAR
                </a>

                <a href="/usuarios/novo" class="botao botao-verde">
                    NOVO USUÁRIO
                </a>

            </div>

        </div>

        <div id="modalExcluir" class="modal">

            <div class="modal-conteudo">

                <h2>Confirmar exclusão</h2>

                <p>Deseja realmente excluir este usuário?</p>

                <div class="acoes">

                    <button type="button"
                            id="cancelarModal"
                            class="botao botao-azul">
                        CANCELAR
                    </button>

                    <a href="#"
                       id="confirmarExcluir"
                       class="botao botao-vermelho">
                        EXCLUIR
                    </a>

                </div>

            </div>

        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {

                /* Marca o menu Usuários como ativo */
                const menuUsuarios =
                        document.getElementById("menu-usuarios");

                if (menuUsuarios) {
                    menuUsuarios.classList.add("ativo");
                }


                /* =============================================
                 PESQUISA AUTOMÁTICA
                 ============================================= */

                const pesquisa =
                        document.getElementById("pesquisaUsuario");

                pesquisa.addEventListener("input", function () {

                    const termo =
                            pesquisa.value.toLowerCase().trim();

                    const linhas =
                            document.querySelectorAll(
                                    "#tabelaUsuarios tbody tr"
                                    );

                    linhas.forEach(function (linha) {

                        const texto =
                                linha.innerText.toLowerCase();

                        linha.style.display =
                                texto.includes(termo)
                                ? ""
                                : "none";
                    });
                });


                /* =============================================
                 MODAL DE EXCLUSÃO
                 ============================================= */

                const modal =
                        document.getElementById("modalExcluir");

                const confirmar =
                        document.getElementById("confirmarExcluir");

                const cancelar =
                        document.getElementById("cancelarModal");

                const botoesExcluir =
                        document.querySelectorAll(".btn-excluir");

                botoesExcluir.forEach(function (botao) {

                    botao.addEventListener("click", function () {

                        const url =
                                botao.getAttribute("data-url");

                        confirmar.setAttribute("href", url);

                        modal.style.display = "flex";
                    });
                });

                cancelar.addEventListener("click", function () {

                    confirmar.setAttribute("href", "#");

                    modal.style.display = "none";
                });

                window.addEventListener("click", function (event) {

                    if (event.target === modal) {

                        confirmar.setAttribute("href", "#");

                        modal.style.display = "none";
                    }
                });
            });
        </script>

    </body>
</html>
